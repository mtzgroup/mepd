[project]
name = "mepd"
version = "0.1.0"
description = "Minimal NEB/MSMEP/transition-state-optimization/network-completion toolkit built on the qcdata/qccompute/chemcloud stack"
authors = [{name = "Jan", email = "janestrada7@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "chemcloud>=0.17.0",
    "geometric>=1.1",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "openbabel-wheel>=3.1.1.22",
    "pydantic>=2.8.2",
    "pysmiles>=2.0.0",
    "qccompute>=0.14.0",
    "qccodec>=0.12.0",
    "qcinf>=0.4.1",
    "qcdata>=0.19.0",
    "qcconst>=0.2.1",
    "rdkit>=2025.3.6",
    "scipy>=1.15.3",
    "timeout-timer>=0.2.0",
    "tomli>=2.2.1",
    "tomli-w>=1.2.0",
    "typer>=0.17.4",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.9.1",
    "ipython>=8.37.0",
    "qcdata[view]>=0.19.0",
]
discovery = [
    "rich>=13.0.0",
]
# `mepd web`: browser UI (FastAPI server; Preact, Cytoscape and 3Dmol are
# vendored under mepd/web/static/vendor, so no JS build step or internet).
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
# ASEEngine (engine_name="ase") and its SELLA-based TS-opt/IRC support. Not
# needed for the qc*/chemcloud-backed engines, which are the main workhorse.
ase = [
    "ase>=3.26.0",
    "sella>=2.3.4",
]
# GXTBCalculator (engine_name="gxtb") wraps g-xTB as an ase.Calculator --
# a temporary workaround until qccompute supports g-xTB natively. TS-opt/IRC
# through gxtb additionally goes through ASEEngine/Sella, so this pulls in
# the same packages as the `ase` extra.
gxtb = [
    "ase>=3.26.0",
    "sella>=2.3.4",
]
# mepd.atom_mapping: SLAPMapper-based atom-to-atom mapping (WL-like iterative
# label refinement + sequential linear assignment problems), used to sanity-
# check --start/--end atom correspondence in `mepd run` and to build a
# consistently-indexed structure pair when --start/--end are given as SMILES.
# Implements Koda, "General and scalable atom-to-atom mapping via
# Weisfeiler-Lehman-like approximate graph matching" (ChemRxiv, 2025,
# https://chemrxiv.org/doi/10.26434/chemrxiv-2025-hthwn). Not on PyPI yet --
# installed directly from its GitHub repo.
aam = [
    "slapmapper @ git+https://github.com/shin1koda/slap-mapper",
]
# FAIRChemEngine (engine_name="fairchem"): UMA and other FAIR-Chem MLIPs.
# The UMA weights are gated on Hugging Face (facebook/UMA): accept the
# license, then `hf auth login`. Pulls in PyTorch.
mlip = [
    "fairchem-core>=2.23.0; python_version >= '3.11'",
]

[project.scripts]
mepd = "mepd.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mepd"]

[tool.uv]
# fairchem-core (the `mlip` extra) declares numpy<2.5 as a not-yet-tested
# cap, not a known incompatibility -- it raises the cap once its CI passes.
# Keep the numpy the rest of the project runs on instead of downgrading it.
override-dependencies = ["numpy>=2.2.6,<2.6"]

[tool.hatch.metadata]
# The `aam` optional-dependency group pins slapmapper via a git URL
# (direct reference), which hatchling refuses to build without this.
allow-direct-references = true
