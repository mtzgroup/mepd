[project]
name = "mepd"
version = "0.1.0"
description = "Minimal NEB/MSMEP/transition-state-optimization/network-completion toolkit built on the qcdata/qccompute/chemcloud stack"
authors = [{name = "Jan", email = "janestrada7@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "ase>=3.26.0",
    "chemcloud>=0.17.0",
    "geometric>=1.1",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "openbabel-wheel>=3.1.1.22",
    "pydantic>=2.8.2",
    "pysmiles>=2.0.0",
    "qccompute>=0.13.3",
    "qccodec>=0.11.2",
    "qcinf>=0.4.1",
    "qcdata[view]>=0.18.1",
    "qcconst>=0.2.1",
    "rdkit>=2025.3.6",
    "scipy>=1.15.3",
    "sella>=2.3.4",
    "timeout-timer>=0.2.0",
    "tomli>=2.2.1",
    "tomli-w>=1.2.0",
    "typer>=0.17.4",
]

[project.scripts]
mepd = "mepd.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mepd"]
