[project]
name = "mepd"
version = "0.1.0"
description = "Minimal NEB/MSMEP/transition-state-optimization/network-completion toolkit built on the qcdata/qccompute/chemcloud stack"
authors = [{name = "Jan", email = "janestrada7@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "chemcloud>=0.17.0",
    "geometric>=1.1",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "openbabel-wheel>=3.1.1.22",
    "pydantic>=2.8.2",
    "pysmiles>=2.0.0",
    "qccompute>=0.13.3",
    "qccodec>=0.11.2",
    "qcinf>=0.4.1",
    "qcdata>=0.18.1",
    "qcconst>=0.2.1",
    "rdkit>=2025.3.6",
    "scipy>=1.15.3",
    "timeout-timer>=0.2.0",
    "tomli>=2.2.1",
    "tomli-w>=1.2.0",
    "typer>=0.17.4",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.9.1",
    "ipython>=8.37.0",
    "qcdata[view]>=0.18.1",
]
discovery = [
    "rich>=13.0.0",
]
# ASEEngine (engine_name="ase") and its SELLA-based TS-opt/IRC support. Not
# needed for the qc*/chemcloud-backed engines, which are the main workhorse.
ase = [
    "ase>=3.26.0",
    "sella>=2.3.4",
]
# GXTBCalculator (engine_name="gxtb") wraps g-xTB as an ase.Calculator --
# a temporary workaround until qccompute supports g-xTB natively. TS-opt/IRC
# through gxtb additionally goes through ASEEngine/Sella, so this pulls in
# the same packages as the `ase` extra.
gxtb = [
    "ase>=3.26.0",
    "sella>=2.3.4",
]
# OllamaBackend (mepd agentic tune --backend ollama) talks HTTP to a local or
# Ollama-Cloud-proxied Ollama server. httpx is already pulled in transitively
# by chemcloud, but declared explicitly here so it isn't an undocumented
# accidental dependency.
agentic = [
    "httpx>=0.27.0",
]

[project.scripts]
mepd = "mepd.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mepd"]
