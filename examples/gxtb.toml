engine_name = "gxtb"
path_min_method = "neb"

[gxtb_engine_kwds]
executable = "/Users/janestrada/xtbinstall/bin/gxtb"
n_threads = 1

[path_min_inputs]
climb = true
en_thre = 0.0005
rms_grad_thre = 0.01
max_rms_grad_thre = 0.02
skip_identical_graphs = true
ts_grad_thre = 0.01
ts_spring_thre = 0.01
barrier_thre = 0.5
early_stop_force_thre = 0.01
negative_steps_thre = 100000
positive_steps_thre = 10000
use_geodesic_tangent = false
do_elem_step_checks = true
max_steps = 500
v = 1

[chain_inputs]
k = 0.1
delta_k = 0.09
use_geodesic_interpolation = true

[gi_inputs]
nimages = 12
friction = 0.01
nudge = 0.1
align = true

[gi_inputs.extra_kwds]

[optimizer_kwds]
name = "gd"
timestep = 0.5
step_up = 1.5
step_down = 0.5
min_timestep = 0.01
max_timestep = 2.0
max_step_norm = 0.05
